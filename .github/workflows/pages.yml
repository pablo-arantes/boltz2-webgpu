# GitHub Pages deploy for the screening page.
#
# 🔴 THE TWO GUARDS BELOW ARE THE POINT OF THIS WORKFLOW, NOT THE DEPLOY. It
# refuses to publish a site with no `screen.html` - which is what happens
# whenever the `boltz2-affinity` bundle's `remote` is null, because
# tools/build_site.py drops an unservable page rather than ship one that 404s
# on shard zero - and it refuses any root-absolute reference, which is the usual
# reason a fork 404s under a project page's /<repo>/ base path. Both were
# watched failing before being trusted.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; never cancel a running one midway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🔴 THE GATES RUN BEFORE THE BUILD, because a site that builds is not the
      # same as a site that is right. `npm test` is the CPU suite; test:sizes
      # fails on an undeclared tracked file over 10 MiB or ANY file that large
      # reaching dist/, which is the publishing brief's own rule.
      - run: npm test
      - run: npm run test:sizes
      - run: npm run test:canonical-rank
      - run: npm run test:canonical-names

      - name: Build the site
        run: python3 tools/build_site.py

      # 🔴 REFUSE TO PUBLISH A SITE WITHOUT ITS DELIVERABLE. build_site.py drops
      # an unservable page and says so; this turns that into a failure, so the
      # only way to a green deploy is a published bundle with its revision
      # pinned. A site missing the screening page is the failure this whole
      # workflow exists to avoid shipping quietly.
      - name: Refuse a site with no screening page
        run: |
          if [ ! -f dist/screen.html ]; then
            echo "::error::dist/ has no screen.html - the boltz2-affinity bundle"
            echo "::error::has no \`remote\` in shared/bundles/manifests/index.js, so"
            echo "::error::build_site.py dropped the page rather than ship a 404."
            echo "::error::Publish model-boltz2-affinity-int5/ and pin its revision."
            exit 1
          fi
          echo "screen.html is present; the affinity bundle is servable."

      # 🔴 NO BASE-PATH REWRITING IS NEEDED AND THAT IS CHECKED, NOT ASSUMED. A
      # project page is served from /<repo>/, so a single root-absolute asset,
      # worker, wasm or manifest reference would 404. dist/ is entirely
      # relative; this fails if that ever stops being true.
      - name: Refuse root-absolute references
        run: |
          # 🔴 BOTH QUOTE STYLES. The first version of this guard matched only
          # double quotes and so missed `import('/web/screen-export.js')` - a
          # single-quoted root-absolute import, which is the exact shape that
          # 404s under /<repo>/. Found by the live run, in the test harness.
          if grep -rnoE "(src|href)=[\"']/[^/\"']|import\([\"']/|from [\"']/|fetch\([\"']/|new Worker\([\"']/" \
               dist --include='*.html' --include='*.js'; then
            echo "::error::dist/ contains root-absolute references; they 404 under /<repo>/."
            exit 1
          fi
          echo "every reference in dist/ is relative - safe for a project page."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
